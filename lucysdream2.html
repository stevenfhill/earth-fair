<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Device Income Lookup</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 85vh; width: 100%; }
    #info { padding: 12px; font-size: 16px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="info">Requesting your location...</div>

  <script>
    const GEOJSON_URL =
      "https://raw.githubusercontent.com/stevenfhill/earth-fair/main/income_grid.geojson";
    const INCOME_FIELD = "income_mean";

    const map = L.map("map").setView([35.79, -78.78], 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    let gridData = null;
    let userMarker = null;

    function reportIncomeAt(lat, lng) {
      const infoEl = document.getElementById("info");

      if (!gridData) {
        infoEl.textContent = "Grid data is still loading...";
        return;
      }

      const pt = turf.point([lng, lat]); // Turf expects [longitude, latitude]
      const match = gridData.features.find((feature) =>
        turf.booleanPointInPolygon(pt, feature)
      );

      if (match) {
        const val = match.properties[INCOME_FIELD];
        infoEl.textContent =
          val !== undefined && val !== null
            ? `Mean income at your location: ${val}`
            : `Matched tile, but "${INCOME_FIELD}" was not found on this feature.`;
      } else {
        infoEl.textContent = "No grid tile found at your current location.";
      }
    }

    function requestDeviceLocation() {
      const infoEl = document.getElementById("info");

      if (!("geolocation" in navigator)) {
        infoEl.textContent = "Geolocation is not supported by this device/browser.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          map.setView([latitude, longitude], 13);

          if (userMarker) {
            userMarker.setLatLng([latitude, longitude]);
          } else {
            userMarker = L.marker([latitude, longitude]).addTo(map);
          }

          reportIncomeAt(latitude, longitude);
        },
        (err) => {
          infoEl.textContent = `Location request failed: ${err.message}`;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    fetch(GEOJSON_URL)
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then((data) => {
        gridData = data;
        L.geoJSON(data, {
          style: { color: "#2b6cb0", weight: 1, fillOpacity: 0.2 }
        }).addTo(map);
        requestDeviceLocation();
      })
      .catch((err) => {
        document.getElementById("info").textContent =
          "Error loading income_grid.geojson: " + err.message;
      });
  </script>
</body>
</html>
