<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wake County Map</title>
    <!-- Leaflet CSS for map styling -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: "Inter", sans-serif;
        }

        #map-container {
            height: 500px;
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-start min-h-screen p-4">

    <h1 class="text-3xl font-bold text-gray-800 mb-4">Wake County Geo-Fencing App</h1>

    <!-- Persistent Status Banner -->
    <div id="status-banner" class="w-full max-w-4xl mb-4 p-4 rounded-xl shadow-md bg-white border-l-4 border-blue-500 text-center transition-all duration-300">
        <p id="message-text" class="text-xl font-bold text-gray-800">Checking your location...</p>
    </div>

    <div id="map-container" class="w-full max-w-4xl shadow-lg rounded-xl">
        <div id="map"></div>
    </div>

    <!-- Leaflet JavaScript and Turf.js -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.3.0/turf.min.js"></script>

    <script>
        window.onload = function() {
            // Initialize the map centered on Wake County, North Carolina
            const map = L.map('map').setView([35.77603969549853, -78.63832970038803], 12);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            const statusBanner = document.getElementById('status-banner');
            const messageText = document.getElementById('message-text');

            // Function to update the persistent banner text and color
            function showPersistentMessage(message, type = 'info') {
                messageText.textContent = message;

                // Reset base classes
                statusBanner.className = "w-full max-w-4xl mb-4 p-4 rounded-xl shadow-md border-l-4 text-center transition-all duration-300";

                if (type === 'safe') {
                    statusBanner.classList.add('bg-green-100', 'border-green-600', 'text-green-900');
                    messageText.className = "text-xl font-bold text-green-900";
                } else if (type === 'alert') {
                    statusBanner.classList.add('bg-red-100', 'border-red-600', 'text-red-900');
                    messageText.className = "text-xl font-bold text-red-900";
                } else {
                    statusBanner.classList.add('bg-white', 'border-blue-500', 'text-gray-800');
                    messageText.className = "text-xl font-bold text-gray-800";
                }
            }

            // Fetch the GeoJSON data
            fetch('https://raw.githubusercontent.com/stevenfhill/earth-fair/main/school_buffer.json')
                .then(response => response.json())
                .then(geojsonData => {
                    // Add the GeoJSON layer to the map
                    L.geoJSON(geojsonData, {
                        style: {
                            color: '#ef4444',
                            weight: 2,
                            fillOpacity: 0.2
                        }
                    }).addTo(map);

                    // Get the user's current location
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            function(position) {
                                const userLatLng = L.latLng(position.coords.latitude, position.coords.longitude);

                                // Add a marker for the user's location
                                L.marker(userLatLng).addTo(map)
                                    .bindPopup("You are here!").openPopup();

                                map.setView(userLatLng, 15);

                                // Check if the user is inside ANY of the polygons
                                let isInsideAny = false;
                                geojsonData.features.forEach(feature => {
                                    if (turf.booleanPointInPolygon(turf.point([userLatLng.lng, userLatLng.lat]), feature.geometry)) {
                                        isInsideAny = true;
                                    }
                                });

                                if (isInsideAny) {
                                    showPersistentMessage("you are a creep", "alert");
                                } else {
                                    showPersistentMessage("good to go man", "safe");
                                }
                            },
                            function(error) {
                                console.error("Geolocation error:", error);
                                showPersistentMessage("Geolocation failed: " + error.message, "alert");
                            }
                        );
                    } else {
                        showPersistentMessage("Geolocation is not supported by your browser.", "alert");
                    }
                })
                .catch(error => {
                    console.error("Error loading GeoJSON:", error);
                    showPersistentMessage("Failed to load school buffer boundaries.", "alert");
                });
        };
    </script>
</body>
</html>
